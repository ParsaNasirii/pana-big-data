apiVersion: v1
kind: Service
metadata:
  name: {{ include "monitoring-stack.resourceName" (dict "root" . "component" "grafana") }}
spec:
  type: {{ .Values.grafana.service.type }}

  selector:
    app: {{ include "monitoring-stack.resourceName" (dict "root" . "component" "grafana") }}

  ports:
    - name: http
      port: {{ .Values.grafana.service.port }}
      targetPort: 3000
