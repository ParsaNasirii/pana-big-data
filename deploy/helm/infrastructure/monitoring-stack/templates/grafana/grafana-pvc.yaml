apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "monitoring-stack.resourceName" (dict "root" . "component" "grafana-data") }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.grafana.storage.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.grafana.storage.size | quote }}
