apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "monitoring-stack.resourceName" (dict "root" . "component" "prometheus") }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "monitoring-stack.resourceName" (dict "root" . "component" "prometheus-pod-discovery") }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "monitoring-stack.resourceName" (dict "root" . "component" "prometheus-pod-discovery") }}
subjects:
  - kind: ServiceAccount
    name: {{ include "monitoring-stack.resourceName" (dict "root" . "component" "prometheus") }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "monitoring-stack.resourceName" (dict "root" . "component" "prometheus-pod-discovery") }}
