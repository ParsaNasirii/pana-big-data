apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "postgres.name" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "postgres.name" . }}
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - endpoints
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "postgres.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "postgres.name" . }}
roleRef:
  kind: Role
  name: {{ include "postgres.name" . }}
  apiGroup: rbac.authorization.k8s.io