apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-ui" (include "cube-maker.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "cube-maker.labels" . | nindent 4 }}
spec:
  type: LoadBalancer
  ports:
    - name: webui
      port: 4040
      targetPort: 4040
  selector:
    {{- include "cube-maker.selectorLabels" . | nindent 4 }}
