apiVersion: v1
kind: Service
metadata:
  name: {{ include "cube-maker.driverServiceName" . }}
  labels:
    {{- include "cube-maker.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: driver-rpc
      port: {{ .Values.driver.port }}
      targetPort: driver-rpc
    - name: block-manager
      port: {{ .Values.driver.blockManagerPort }}
      targetPort: block-manager
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
  selector:
    {{- include "cube-maker.selectorLabels" . | nindent 4 }}
