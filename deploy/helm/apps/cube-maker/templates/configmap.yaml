apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cube-maker.fullname" . }}-config
  labels:
    {{- include "cube-maker.labels" . | nindent 4 }}
data:
  application.properties: |-
    {{- range $key, $value := .Values.config }}
    {{ $key }}={{ $value }}
    {{- end }}
  METRICS_PORT: {{ .Values.metrics.port | quote }}
  PUSHGATEWAY_ADDRESS: {{ .Values.pushGateway.address | quote }}
  SPARK_DRIVER_HOST: {{ printf "%s.%s.svc.cluster.local" (include "cube-maker.driverServiceName" .) .Release.Namespace | quote }}
  SPARK_DRIVER_PORT: {{ .Values.driver.port | quote }}
  SPARK_DRIVER_BLOCK_MANAGER_PORT: {{ .Values.driver.blockManagerPort | quote }}
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- range $key, $value := .Values.hadoopConfig }}
  {{ printf "SPARK_HADOOP_%s" $key | quote }}: {{ $value | quote }}
  {{- end }}
