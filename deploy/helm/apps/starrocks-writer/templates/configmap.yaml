apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "starrocks-writer.fullname" . }}-config
  labels:
    {{- include "starrocks-writer.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.env }}
  {{- if not (has $key (list "KAFKA_BOOTSTRAP_SERVERS" "STARROCKS_USERNAME" "STARROCKS_PASSWORD")) }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
  METRICS_PORT: {{ .Values.metrics.port | quote }}
  KAFKA_BOOTSTRAP_SERVERS: {{ index .Values.config.kafka "bootstrap.servers" | quote }}
  application.properties: |
    {{- range $key, $value := .Values.config.kafka }}
    {{ $key }}={{ $value }}
    {{- end }}
    {{- range $key, $value := .Values.config.starrocks }}
    {{ $key }}={{ $value }}
    {{- end }}
