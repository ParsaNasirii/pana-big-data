apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "parquet-writer.fullname" . }}-config
  labels:
    {{- include "parquet-writer.labels" . | nindent 4 }}
data:
  application.properties: |-
    {{- range $key, $value := .Values.config.application }}
    {{ $key }}={{ $value }}
    {{- end }}

    {{- range $key, $value := .Values.config.kafka }}
    {{ $key }}={{ $value }}
    {{- end }}

  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
