---
java_url: "https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.6%2B10/OpenJDK17U-jdk_x64_linux_hotspot_17.0.6_10.tar.gz"
java_home: "/opt/java"

kafka_version: "3.7.2"
scala_version: "2.13"
kafka_download_mirror: "https://archive.apache.org/dist/kafka/{{ kafka_version }}"
kafka_url: "{{ kafka_download_mirror }}/kafka_{{ scala_version }}-{{ kafka_version }}.tgz"

kafka_dir: "/opt/kafka"
kafka_data_dir: "/mnt/disk1/kafka/data"

cluster_id: "{{ lookup('env', 'KAFKA_CLUSTER_ID') }}"
controller_quorum_voters: "{% for host in groups['kafka'] %}{{ hostvars[host].kafka_node_id }}@{{ hostvars[host].ansible_host }}:9093{% if not loop.last %},{% endif %}{% endfor %}"
