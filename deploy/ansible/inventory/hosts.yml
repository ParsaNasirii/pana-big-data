---
all:
  hosts:
    node1:
      ansible_host: 192.0.2.11
      starrocks_priority_networks: "{{ ansible_host }}/32"
      kafka_node_id: 1
    node2:
      ansible_host: 192.0.2.12
      starrocks_priority_networks: "{{ ansible_host }}/32"
      kafka_node_id: 2
    node3:
      ansible_host: 192.0.2.13
      starrocks_priority_networks: "{{ ansible_host }}/32"
      kafka_node_id: 3
    node4:
      ansible_host: 192.0.2.14
      starrocks_priority_networks: "{{ ansible_host }}/32"
      kafka_node_id: 4
    localhost:
      ansible_connection: local
      ansible_become: false
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
  children:
    kafka:
      hosts:
        node1:
        node2:
        node3:
        node4:
    starrocks:
      children:
        starrocks_fe:
          children:
            starrocks_leader:
              hosts:
                node1:
            starrocks_followers:
              hosts:
                node2:
                node3:
                node4:
        starrocks_be:
          hosts:
            node1:
            node2:
            node3:
            node4:
