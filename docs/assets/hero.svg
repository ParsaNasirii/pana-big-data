<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" fill="none" role="img" aria-labelledby="hero-title hero-description">
  <title id="hero-title">Pana Big Data</title>
  <desc id="hero-description">Stream. Archive. Analyze. Restore. A dark navy banner with bold white typography and cyan, teal, and amber paths flowing through a columnar data grid.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101D30"/>
      <stop offset=".62" stop-color="#0B1525"/>
      <stop offset="1" stop-color="#0E2232"/>
    </linearGradient>
    <radialGradient id="ambient" cx="0" cy="0" r="1" gradientTransform="translate(1025 235) rotate(90) scale(300 430)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#27D4CC" stop-opacity=".09"/>
      <stop offset="1" stop-color="#27D4CC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stream" x1="700" y1="240" x2="1220" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#64DBF3" stop-opacity="0"/>
      <stop offset=".2" stop-color="#64DBF3" stop-opacity=".8"/>
      <stop offset=".7" stop-color="#5FE1D1"/>
      <stop offset="1" stop-color="#5FE1D1" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="column" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#7EEDE0" stop-opacity=".38"/>
      <stop offset="1" stop-color="#2FBFB6" stop-opacity=".07"/>
    </linearGradient>
    <pattern id="matrix" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#7FA5BC" fill-opacity=".17"/>
    </pattern>
    <pattern id="cells" width="32" height="32" patternUnits="userSpaceOnUse" x="864" y="128">
      <rect x="1" y="1" width="25" height="25" rx="3" fill="#244051" fill-opacity=".45" stroke="#79B9C5" stroke-opacity=".11"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1280" height="480" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="480" fill="url(#background)"/>
    <rect x="640" width="640" height="480" fill="url(#ambient)"/>
    <rect x="704" y="40" width="560" height="400" fill="url(#matrix)"/>
    <path d="M704 64H1216M704 416H1216" stroke="#7895AB" stroke-opacity=".12"/>
    <path d="M768 64V416M1216 64V416" stroke="#7895AB" stroke-opacity=".08"/>

    <!-- The wordmark stays separate from the illustration for small displays. -->
    <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
      <rect x="68" y="70" width="28" height="3" rx="1.5" fill="#62DFD0"/>
      <text x="110" y="76" fill="#A5B7CA" font-size="13" font-weight="600" letter-spacing="2.4">DISTRIBUTED NETFLOW ANALYTICS</text>
      <text x="62" y="206" fill="#F3F7FC" font-size="106" font-weight="800" letter-spacing="7">PANA</text>
      <text x="65" y="301" fill="#F3F7FC" font-size="84" font-weight="750" letter-spacing="1.5">BIG DATA</text>
      <text x="69" y="365" fill="#B6C8DA" font-size="25" font-weight="400" letter-spacing=".1">Stream. Archive. Analyze. Restore.</text>
      <path d="M69 410H111" stroke="#63DECF" stroke-width="3" stroke-linecap="round"/>
      <path d="M122 410H144" stroke="#64DBF3" stroke-width="3" stroke-linecap="round" stroke-opacity=".65"/>
      <path d="M155 410H164" stroke="#EDBC76" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Parallel streams meet a compact grid of archived columnar blocks. -->
    <rect x="843" y="108" width="306" height="272" rx="12" fill="#0E2030" stroke="#6EADC0" stroke-opacity=".12"/>
    <path d="M862 108H1137C1143.63 108 1149 113.37 1149 120V356" stroke="#63DACA" stroke-opacity=".35"/>
    <rect x="864" y="128" width="256" height="224" fill="url(#cells)"/>

    <g fill="url(#column)">
      <rect x="865" y="129" width="25" height="217" rx="3"/>
      <rect x="929" y="129" width="25" height="217" rx="3"/>
      <rect x="993" y="129" width="25" height="217" rx="3"/>
      <rect x="1057" y="129" width="25" height="217" rx="3"/>
    </g>
    <g fill="#78E5D6">
      <rect x="865" y="129" width="25" height="25" rx="3" fill-opacity=".65"/>
      <rect x="929" y="193" width="25" height="25" rx="3" fill-opacity=".53"/>
      <rect x="993" y="225" width="25" height="25" rx="3" fill-opacity=".8"/>
      <rect x="1057" y="161" width="25" height="25" rx="3" fill-opacity=".46"/>
      <rect x="1057" y="321" width="25" height="25" rx="3" fill-opacity=".55"/>
    </g>
    <g fill="#6CCFEA">
      <rect x="897" y="257" width="25" height="25" rx="3" fill-opacity=".48"/>
      <rect x="961" y="161" width="25" height="25" rx="3" fill-opacity=".37"/>
      <rect x="1089" y="257" width="25" height="25" rx="3" fill-opacity=".6"/>
    </g>
    <rect x="1025" y="289" width="25" height="25" rx="3" fill="#EDBC76" fill-opacity=".8"/>

    <g stroke="url(#stream)" stroke-width="2" stroke-linecap="round">
      <path d="M700 174H769C800 174 798 141 831 141H877"/>
      <path d="M716 237H804C838 237 839 205 868 205H941"/>
      <path d="M708 301H772C809 301 809 269 840 269H909"/>
      <path d="M1006 237H1150C1178 237 1174 205 1200 205H1252"/>
      <path d="M1102 269H1174C1202 269 1202 301 1227 301H1280"/>
    </g>
    <path d="M748 363H815C847 363 847 333 881 333H969C1006 333 1004 301 1037 301" stroke="#EDBC76" stroke-width="1.5" stroke-linecap="round" stroke-opacity=".72"/>
    <g fill="#91EFE1">
      <circle cx="768" cy="174" r="4"/>
      <circle cx="808" cy="237" r="3"/>
      <circle cx="1176" cy="222" r="3"/>
    </g>
    <circle cx="815" cy="363" r="3" fill="#EDBC76"/>
    <circle cx="1227" cy="301" r="3" fill="#78DDF0"/>
    <g stroke="#A4BFD0" stroke-opacity=".4" stroke-linecap="round">
      <path d="M1208 84H1224M1216 76V92"/>
      <path d="M760 396H776M768 388V404"/>
    </g>
    <rect x=".5" y=".5" width="1279" height="479" rx="19.5" stroke="#738DA8" stroke-opacity=".18"/>
  </g>
</svg>
